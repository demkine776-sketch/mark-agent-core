name: Agent Worker
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -q gradio_client edge-tts
      - env:
          TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
          TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
          HUGGINGFACE_API_TOKEN: ${{secrets.HUGGINGFACE_API_TOKEN}}
        run: python skills/voice_sync_avatar.py > run.log 2>&1 || true
      - name: Send result
        if: always()
        env:
          T: ${{secrets.TELEGRAM_BOT_TOKEN}}
          C: ${{secrets.TELEGRAM_CHAT_ID}}
        run: |
          echo "CAP=$(head -c 800 status.txt 2>/dev/null || tail -c 800 run.log | tr '\n' ' ')" >> $GITHUB_ENV
          if [ -f out.mp4 ]; then
            curl -s -X POST https://api.telegram.org/bot$T/sendVideo -F chat_id=$C -F video=@out.mp4 -F caption="$CAP"
          else
            curl -s -X POST https://api.telegram.org/bot$T/sendMessage -d chat_id=$C -d text="Worker failed: out.mp4 not found. Log: $CAP"
          fi
