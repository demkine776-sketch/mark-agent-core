name: Agent Worker
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -q gTTS imageio-ffmpeg requests
      - name: Run voice_sync_avatar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python skills/voice_sync_avatar.py
      - name: Send Telegram Notification
        if: always()
        shell: python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          import os, json, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          status = os.environ.get("JOB_STATUS")
          if token and chat_id:
              data = json.dumps({"chat_id": chat_id, "text": f"Воркер завершён. Статус: {status}"}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data, headers={"Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req)
              except Exception:
                  pass
